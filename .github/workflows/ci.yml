name: CI

on: [push, pull_request]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [aws-cleanup, ebs-audit, iam-audit, cost-report, log-rotator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: python/${{ matrix.tool }}
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: python/${{ matrix.tool }}
        run: pytest .

  bash-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          find . -name "*.sh" -exec shellcheck {} +

  go-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [healthcheck, log-parser, kube-cleaner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        working-directory: go/${{ matrix.tool }}
        run: go build ./...
      - name: Run tests (if any)
        working-directory: go/${{ matrix.tool }}
        run: go test ./... || true
